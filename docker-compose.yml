# ---------------------------------------------------------------------------
# EventFlow — local development topology
#
# Everything a junior should notice here:
#   * every service gets its config from the environment, never hardcoded
#   * every stateful service has a healthcheck, and dependants wait on it
#   * the API process and the consumer/worker process are SEPARATE containers,
#     even though they share an image — web traffic and background work must
#     never share a process, because one will starve the other
#   * volumes are named, so `make down` keeps data and `make clean` wipes it
# ---------------------------------------------------------------------------
name: eventflow

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-orders.events}
  KAFKA_TOPIC_INVENTORY: ${KAFKA_TOPIC_INVENTORY:-inventory.events}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-eventflow.notifications}
  JWT_SECRET: ${JWT_SECRET:-dev-only-shared-jwt-secret-change-me}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  POSTGRES_USER: ${POSTGRES_USER:-eventflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventflow}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

x-depends-on-infra: &depends-on-infra
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ======================= INFRASTRUCTURE ==================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventflow}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly keeps data across restarts; for a pure cache you would not bother
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft mode: no ZooKeeper. Single broker is fine locally; production runs 3+.
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3          # 3 partitions => up to 3 parallel consumers
      CLUSTER_ID: eventflow-local-cluster
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: eventflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports: ["8080:8080"]
    depends_on:
      kafka:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"     # management UI: guest / guest
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]  # ping passes before AMQP accepts connections
      interval: 10s
      timeout: 5s
      retries: 10

  # ======================= ORDERS (Django) =================================
  orders-api:
    build:
      context: .
      dockerfile: services/orders-django/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: orders-api
      POSTGRES_DB: ${ORDERS_DB:-orders_db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-a-real-secret-change-me}
      DJANGO_DEBUG: "true"
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000 --workers 3 --timeout 30
      --access-logfile - --error-logfile -
    ports: ["8001:8000"]
    depends_on: *depends-on-infra
    volumes: ["./services/orders-django:/app", "./libs:/libs"]

  # The outbox relay: reads committed outbox rows and publishes them to Kafka.
  # Separate process so a Kafka outage can never block an HTTP request.
  orders-outbox:
    build:
      context: .
      dockerfile: services/orders-django/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: orders-outbox
      POSTGRES_DB: ${ORDERS_DB:-orders_db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-a-real-secret-change-me}
    healthcheck:
      disable: true
    command: python manage.py relay_outbox
    restart: unless-stopped
    depends_on: *depends-on-infra
    volumes: ["./services/orders-django:/app", "./libs:/libs"]

  # Consumes inventory.events and advances the saga.
  orders-consumer:
    build:
      context: .
      dockerfile: services/orders-django/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: orders-consumer
      POSTGRES_DB: ${ORDERS_DB:-orders_db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-a-real-secret-change-me}
    healthcheck:
      disable: true
    command: python manage.py consume_events
    restart: unless-stopped
    depends_on: *depends-on-infra
    volumes: ["./services/orders-django:/app", "./libs:/libs"]

  # Celery: scheduled/periodic jobs (expiring stale orders) and slow side-work.
  orders-celery:
    build:
      context: .
      dockerfile: services/orders-django/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: orders-celery
      POSTGRES_DB: ${ORDERS_DB:-orders_db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-a-real-secret-change-me}

    healthcheck:
      disable: true
    command: celery -A config worker --beat --loglevel=info --concurrency=2
    restart: unless-stopped
    depends_on: *depends-on-infra
    volumes: ["./services/orders-django:/app", "./libs:/libs"]

  # ======================= INVENTORY (FastAPI) =============================
  inventory-api:
    build:
      context: .
      dockerfile: services/inventory-fastapi/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: inventory-api
      POSTGRES_DB: ${INVENTORY_DB:-inventory_db}
    # uvicorn with multiple workers; in production put it behind nginx/ingress
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: ["8002:8000"]
    depends_on: *depends-on-infra
    volumes: ["./services/inventory-fastapi:/app", "./libs:/libs"]

  inventory-consumer:
    build:
      context: .
      dockerfile: services/inventory-fastapi/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: inventory-consumer
      POSTGRES_DB: ${INVENTORY_DB:-inventory_db}
    healthcheck:
      disable: true
    command: python -m app.consumer
    restart: unless-stopped
    depends_on: *depends-on-infra
    volumes: ["./services/inventory-fastapi:/app", "./libs:/libs"]

  inventory-outbox:
    build:
      context: .
      dockerfile: services/inventory-fastapi/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: inventory-outbox
      POSTGRES_DB: ${INVENTORY_DB:-inventory_db}
    healthcheck:
      disable: true
    command: python -m app.outbox
    restart: unless-stopped
    depends_on: *depends-on-infra
    volumes: ["./services/inventory-fastapi:/app", "./libs:/libs"]

  # ======================= NOTIFICATIONS (Flask) ===========================
  notifications-api:
    build:
      context: .
      dockerfile: services/notifications-flask/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: notifications-api
      POSTGRES_DB: ${NOTIFICATIONS_DB:-notifications_db}
    command: gunicorn "app:create_app()" --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    ports: ["8003:8000"]
    depends_on: *depends-on-infra
    volumes: ["./services/notifications-flask:/app", "./libs:/libs"]

  # Bridge: Kafka (domain events) -> RabbitMQ (per-recipient work items)
  notifications-bridge:
    build:
      context: .
      dockerfile: services/notifications-flask/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: notifications-bridge
      POSTGRES_DB: ${NOTIFICATIONS_DB:-notifications_db}
    healthcheck:
      disable: true
    command: python -m app.consumer
    restart: unless-stopped
    depends_on: *depends-on-infra
    volumes: ["./services/notifications-flask:/app", "./libs:/libs"]

  # Worker: drains the RabbitMQ work queue, retries with backoff, dead-letters.
  notifications-worker:
    build:
      context: .
      dockerfile: services/notifications-flask/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: notifications-worker
      POSTGRES_DB: ${NOTIFICATIONS_DB:-notifications_db}

    healthcheck:
      disable: true
    command: python -m app.worker
    restart: unless-stopped
    depends_on: *depends-on-infra
    volumes: ["./services/notifications-flask:/app", "./libs:/libs"]

volumes:
  pgdata:
  redisdata:
  kafkadata:
  rabbitdata:

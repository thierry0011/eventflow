[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --cov=orders
    --cov-report=term-missing
    --cov-fail-under=70

# --strict-markers: a typo'd @pytest.mark.slwo becomes an error instead of a
# marker that silently does nothing and a test that never runs where you think.
#
# --cov-fail-under: a floor, not a target. Coverage measures which lines ran,
# not whether they were verified — 100% coverage with no assertions is
# meaningless. Use it to catch whole modules nobody tested, then ignore the
# number and read the report.

markers =
    integration: needs real Postgres/Kafka (deselect with -m "not integration")
    slow: takes more than a second

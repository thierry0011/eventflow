[pytest]
asyncio_mode = auto
# asyncio_mode=auto means `async def test_...` just works without decorating
# every single test with @pytest.mark.asyncio.

testpaths = app/tests
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    -m "not integration"
    --cov=app
    --cov-report=term-missing

# Integration tests are EXCLUDED by default so the everyday suite stays fast
# and needs no containers. Run them explicitly:
#     pytest -m integration
# and in CI, run both — as separate jobs, so a flaky infrastructure test never
# blocks a unit-test signal.

markers =
    integration: requires real Postgres/Kafka/Redis
    slow: takes more than a second
